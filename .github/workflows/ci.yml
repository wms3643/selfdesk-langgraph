name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: selfdesk_test
          POSTGRES_USER: selfdesk
          POSTGRES_PASSWORD: selfdesk_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfdesk -d selfdesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-dev.txt

      - name: Python 语法
        run: python -m compileall -q app run.py seed_kb.py reindex_kb.py embedding_server.py


      - name: 单元测试
        run: python -m pytest -q

      - name: 数据库测试（两阶段幂等）
        env:
          SELFDESK_TEST_DSN: host=127.0.0.1 port=5432 dbname=selfdesk_test user=selfdesk password=selfdesk_local
        run: python -m pytest -q -m db

      - name: 密钥扫描
        run: |
          set -e
          if grep -rInE "(^|[^A-Za-z0-9])sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY" \
             --exclude-dir=.git --exclude-dir=docs . ; then
            echo "::error::发现疑似密钥，请移除"
            exit 1
          fi
          echo "未发现疑似密钥"

      - name: 敏感文件未被跟踪
        run: |
          set -e
          if git ls-files | grep -E "(^|/)(\.env(\.local)?|\.deepseek-key)$"; then
            echo "::error::敏感文件被提交"
            exit 1
          fi
          echo "工作区干净"

      - name: README 图片引用存在
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          text = (root / "README.md").read_text(encoding="utf-8")
          refs = re.findall(r"!\[[^\]]*\]\(([^)]+)\)", text)
          missing = [
              p for p in refs
              if not p.startswith(("http://", "https://")) and not (root / p).exists()
          ]
          if missing:
              print("缺少图片:", missing)
              sys.exit(1)
          print(f"README 图片检查通过（{len(refs)} 个引用）")
          PY
